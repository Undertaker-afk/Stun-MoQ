[package]
name = "stun_moq"
version = "0.1.0"
edition = "2024"
description = "Cross-platform NAT traversal and E2EE streaming primitives for audio/video/file transport"
license = "MIT"

[dependencies]
chacha20poly1305 = "0.10"
rand = "0.8"
thiserror = "2"
iroh = { version = "1.0.0-rc.0", features = ["tls-ring"] }
iroh-base = "1.0.0-rc.0"
nostr-sdk = { version = "0.38", features = ["all-nips"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
ed25519-dalek = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dashmap = "6.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
